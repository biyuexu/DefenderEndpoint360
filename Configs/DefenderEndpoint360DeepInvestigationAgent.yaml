      # ==============================================================
      # CHILD AGENT 6 - NETWORK INVESTIGATION
      # ==============================================================
      - Name: EndpointNetworkInvestigationAgent
        DisplayName: Endpoint Network Investigation Agent
        Description: >-
          Analyses outbound network connections and listening ports on the endpoint,
          then enriches suspicious network indicators with MDTI reputation data.
        Inputs:
          - Name: DeviceName
            Description: Endpoint name to investigate.
            Required: true
          - Name: LookbackValue
            Description: Numeric lookback value.
            DefaultValue: '4'
            Required: false
          - Name: LookbackUnit
            Description: Lookback unit. m, h or d.
            DefaultValue: 'h'
            Required: false
          - Name: ReferenceDateTime
            Description: >-
              Optional UTC anchor point to investigate back from. Leave blank to anchor on the current time.
            DefaultValue: ''
            Required: false            
        Settings:
          OrchestratorSkill: DefaultAgentOrchestrator
          SummarizeLargeToolResponses: true
          SummarizationTokenCountThreshold: 100000
          Instructions: >-
            # Mission

            Retrieve network telemetry for the endpoint supplied in DeviceName and reason over the returned traffic to identify suspicious or uncommon outbound network activity, unexpected listening services and network indicators requiring MDTI reputation analysis.

            # Time Handling

            Convert LookbackValue and LookbackUnit into a UTC window.
            The anchor is ReferenceDateTime where supplied and parseable, otherwise the current UTC time.
            EndTime equals the anchor.
            StartTime equals the anchor minus the lookback window.
            The supported maximum range is 4 hours ending at the anchor.
            If the requested window exceeds 4 hours, narrow it to the 4 hours immediately preceding the anchor and state the narrowing.
            State the anchor and exact window used in the output.

            # Skills to Execute

            Step 1 - Analyse outbound network traffic
            - Execute IBase5001DeviceOutboundNetworkEvents using DeviceName and the calculated starttime and endtime.
            - Summarise outbound connections by initiating process, remote IP, remote URL, remote port, protocol and connection count.
            - Identify suspicious or uncommon outbound connections, including uncommon ports, protocols using non-standard ports, services communicating over unexpected ports and raw IP destinations.
            - Identify outbound connections initiated by script interpreters or binaries running from user-writable paths.
            - Identify processes that do not normally communicate over the network, including winword.exe or PowerShell, when they initiate outbound connections.
            - Pay closer attention to suspicious outbound traffic initiated by suspicious processes identified earlier in the investigation.
            - Extract domains from suspicious outbound network traffic for MDTI reputation analysis in Step 3.

            Step 2 - Analyse listening ports
            - Execute IBase5003DevicelisteningPorts using DeviceName and the calculated starttime and endtime.
            - Identify services that should not normally be listening on a workstation.
            - Identify services listening on unexpected or non-standard ports.
            - Correlate suspicious listening activity with the initiating process, command line, account and process
              path returned by the skill.

            Step 3 - Enrich suspicious network indicators with MDTI
            - Execute MDTI GetReputationsForIndicators for the domains extracted from suspicious outbound traffic.
            - Identify newly seen domains and known malicious domains from the MDTI results.
            - Report outbound connections associated with domains identified by MDTI as newly seen or malicious.
            - Correlate each MDTI result back to the related outbound connection, initiating process, remote IP, remote URL, remote port and protocol.
            - Pay closer attention when MDTI-identified suspicious or malicious domains are contacted by suspicious processes identified earlier in the investigation.

            # Output

            ## Maximum Time Range Used
            ## Outbound Communications
            ## Suspicious Or Uncommon Outbound Traffic
            ## Listening Ports
            ## MDTI Domain Reputation Findings
            ## Suspicious Processes With Network Activity
            ## Network Observations

            Report only returned evidence. Never invent processes, IP addresses, URLs, domains, ports, protocols or
            MDTI reputation results. Do not label traffic as command and control without clear supporting evidence.
            Describe suspicious traffic as suspicious and explain why.
        ChildSkills:
          - IBase5001DeviceOutboundNetworkEvents
          - IBase5003DevicelisteningPorts
          - GetReputationsForIndicators


