      # ==============================================================
      # NESTED AGENTS FOR AGENT 10 - OUTBOUND EMAIL AND EXFILTRATION
      # ==============================================================
      - Name: EndpointOutboundEmailPatternAgent
        DisplayName: Endpoint Outbound Email Pattern Agent
        Description: >-
          Collects outbound recipient counts, attachment-bearing email counts and per-attachment outbound detail including file name, type, SHA256 and size for the supplied primary user.
        Inputs:
          - Name: DeviceName
            Description: Endpoint name retained for investigation context.
            Required: true
          - Name: LookbackValue
            Description: Numeric lookback value.
            DefaultValue: '30'
            Required: false
          - Name: LookbackUnit
            Description: Lookback unit. m, h or d.
            DefaultValue: 'd'
            Required: false
          - Name: ReferenceDateTime
            Description: Optional UTC investigation anchor.
            DefaultValue: ''
            Required: false
          - Name: PrimaryUserName
            Description: Primary user supplied by the top-level parent.
            DefaultValue: ''
            Required: false
          - Name: UserRoleContext
            Description: User role context supplied by the top-level parent.
            DefaultValue: ''
            Required: false
          - Name: IdentityContextStatus
            Description: Resolved, UserOnly or Unavailable.
            DefaultValue: 'Unavailable'
            Required: false
        Settings:
          OrchestratorSkill: DefaultAgentOrchestrator
          SummarizeLargeToolResponses: true
          SummarizationTokenCountThreshold: 100000
          Instructions: >-
            Calculate the UTC starttime and endtime from the supplied inputs, with a maximum range of 30 days. Use PrimaryUserName exactly as supplied and never re-derive identity. If it is empty or IdentityContextStatus is Unavailable, report every collection step as Unable To Perform and return the data gap.

            Step 1 - Execute IBase8005UserOutboundEmailCount for PrimaryUserName and the exact window. Retain SenderFromAddress, RecipientEmailAddress and OutboundEmailCount exactly as returned.
            Step 2 - Execute IBase8006UserOutboundEmailwithAttachmentCount for PrimaryUserName and the same window. Retain the attachment-bearing count per recipient exactly as returned.
            Step 3 - Execute IBase8007UserOutboundEmailwithAttachmentDetails for PrimaryUserName and the same window. This is the only outbound skill returning file-level detail. Retain Timestamp, SenderDisplayName, SenderFromAddress, RecipientEmailAddress, FileName, FileType, SHA256 and FileSize exactly as returned. Never truncate, reformat or reconstruct a SHA256, since it is the join key used by the orchestrator to confirm whether a sensitivity-labelled file left the organisation.
            Step 4 - Reconcile the three result sets. Where the Step 2 count for a recipient exceeds the number of Step 3 attachment rows for that recipient, state the discrepancy and treat Step 3 as incomplete rather than treating the missing rows as absent activity. Do not adjust either figure to make them agree.
            Step 5 - Identify consumer-mail, uncommon-domain, concentrated-recipient and attachment-bearing patterns. Flag outbound attachments whose FileType is an executable, script, archive or container, and flag unusually large FileSize values relative to the rest of the returned set. Presence of a pattern is not proof of exfiltration and intent must never be inferred.
            Return a structured evidence bundle containing the recipient counts, the attachment-bearing counts, and a distinct outbound attachment set keyed on SHA256 with its recipients, file names, file types, sizes and timestamps. Do not perform device-file correlation, sensitivity-label correlation or reputation analysis; those belong to the orchestrator.
        ChildSkills:
          - IBase8005UserOutboundEmailCount
          - IBase8006UserOutboundEmailwithAttachmentCount
          - IBase8007UserOutboundEmailwithAttachmentDetails

